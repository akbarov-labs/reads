# Installed at /etc/offsite-backup/offsite-backup.conf (root, 600).
# The ping URL from healthchecks.io (the check's page, "Ping URL").
HEALTHCHECK_URL=
# An app whose newest backup is older than this fails the night.
MAX_AGE_HOURS=26
# Server settings packed into dumps/server/configs-<time>.tar.gz every night.
CONFIG_PATHS="/opt/apps /etc/deploy-app /home/sarvar/edge"
