# /etc/deploy-app/reads-staging.conf — read by /usr/local/sbin/deploy-app.
# Root-owned, 644. CI cannot change any of this.

# Staging's own folder: its compose file and its own .env.
APP_DIR=/opt/apps/reads-staging

# Same image as production — staging runs each build first.
REPO=ghcr.io/akbarov-labs/reads

# Staging's own compose file: its own container name and a login prompt.
COMPOSE_FILE=docker-compose.staging.yml

KEEP_IMAGES=3
