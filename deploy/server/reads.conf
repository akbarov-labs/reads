# /etc/deploy-app/reads.conf — read by /usr/local/sbin/deploy-app.
# Root-owned, 644. CI cannot change any of this.

# Where docker-compose.prod.yml and the real .env live.
APP_DIR=/opt/apps/reads

# The image CI builds. Only tags of this repo can be deployed.
REPO=ghcr.io/akbarov-labs/reads

# How many of this app's images to keep on disk as rollback targets.
KEEP_IMAGES=3
