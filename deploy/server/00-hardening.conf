# /etc/ssh/sshd_config.d/00-hardening.conf
#
# Named 00- on purpose: sshd keeps the FIRST value it reads for a setting,
# and Contabo/cloud images ship a 50-cloud-init.conf that can turn password
# login back on. This file is read before it, so it wins.

# Keys only. Nobody can guess their way in.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# Nobody logs in as root; sarvar uses sudo.
PermitRootLogin no

# Only these two users may log in at all. A user created by accident (or by
# an attacker who got that far) still can't SSH in.
AllowUsers sarvar deployer

MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
