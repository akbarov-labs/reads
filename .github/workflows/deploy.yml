name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Build once, then promote: every push to main becomes one image, which goes
# to staging automatically and to production only after staging succeeded
# and someone approved it (Required reviewers on the `production`
# environment). Production therefore always runs an image that already ran
# on staging. Nothing environment-specific is inside the image — each
# environment's .env on the server supplies it.

jobs:
  # Cheap, fast gate before any time goes on a Docker build: a lint failure
  # means the build is likely broken too, and a failing test means a canonical,
  # hreflang, sitemap or structured-data guarantee has regressed — either one
  # stops the deploy.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag and repo (lowercase — GHCR rejects mixed case)
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds the Next.js app inside Docker (see Dockerfile) — this runs on
      # GitHub's runner, not on the VPS, so the VPS's limited RAM never
      # comes into play.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}:latest
            ghcr.io/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    uses: ./.github/workflows/deploy-to.yml
    permissions:
      packages: read
    with:
      environment: staging
      image_tag: ${{ needs.build-and-push.outputs.tag }}
    secrets: inherit

  # Waits for approval in the Actions tab when `production` has Required
  # reviewers set — the point of staging is to look before this runs.
  deploy-production:
    needs: [build-and-push, deploy-staging]
    uses: ./.github/workflows/deploy-to.yml
    permissions:
      packages: read
    with:
      environment: production
      image_tag: ${{ needs.build-and-push.outputs.tag }}
    secrets: inherit
