services:
  # Development server with hot reload — this is what `docker compose up` runs by default.
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      # Reads-admin (Laravel/Sail) runs in its own compose project on the
      # host's port 8000 — host.docker.internal reaches it from inside
      # this container. Override in a .env file if that changes.
      - API_URL=${API_URL:-http://host.docker.internal:8000/api}
      # Browser-facing — the visitor's own browser calls this directly (the
      # inquiry form submits client-side), so it must be an address *their*
      # browser can reach, not this container's. Always "localhost" here,
      # never host.docker.internal.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  # Production build, matching the deploy target. Run with: docker compose --profile prod up web-prod
  web-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
