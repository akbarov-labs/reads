# Staging copy of docker-compose.prod.yml, for the same server. Lives at
# /opt/apps/reads-staging/docker-compose.staging.yml, root-owned, next to
# staging's own .env; deploy-app picks it via COMPOSE_FILE in
# /etc/deploy-app/reads-staging.conf. See docs/staging.md.
#
# Same image as production — CI deploys each build here first, and
# production gets that exact tag only after it is approved. What differs:
#
# - its own container name, so it never replaces reads-app;
# - a login prompt in front of every page (Caddy basic auth), so search
#   engines, bots and real visitors never see it. A staging copy in
#   Google's index would compete with the real site for its own pages.
#
# STAGING_AUTH_HASH below is replaced on the server by a real hash (see
# docs/staging.md). Its `$` signs are written `$$` there, because compose
# would otherwise try to read them as variables.

services:
  app:
    image: ${IMAGE:-ghcr.io/akbarov-labs/reads}:${IMAGE_TAG:-latest}
    container_name: reads-staging-app
    restart: unless-stopped
    env_file: .env
    mem_limit: 256m
    networks:
      - edge
      - reads_net
    labels:
      caddy: ${DOMAIN:?set DOMAIN in .env, e.g. reads.staging.sarvarlogs.uz}
      # Username "staging"; the password is whatever was hashed.
      caddy.basic_auth.staging: STAGING_AUTH_HASH
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  edge:
    external: true
  reads_net:
    external: true
